;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Project Milan joint server configuration. ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

;; WARNING: THIS SECTION IS TEMPORARILY UNUSED!
;; Pending EF Core 10 support for MySQL connectors.
[Common:Database]
;; Address of the MySQL / MariaDB server.
Host = "localhost"
;; Port of the MySQL / MariaDB server.
Port = 3306
;; Name of the database.
Database = "milan"
;; MySQL / MariaDB server username.
User = "milan"
;; User's password.
Password = "milan"

[GameServer:AcceptWorker]
;; Internet address at which the server is listening for clients.
Address = "127.0.0.1:23001"
;; Highest allowed number of concurrent connections.
;; While more connections (than configured by this setting)
;; are active, the server will close all further incoming connections
;; and log a warning. Value of "0" disables the limit.
MaxActiveConnections = 4
;; Whether the server should enforce TLS protection on all connections.
;; Note that if the game server is sitting behind a proxy (such as nginx)
;; which adds encryption on its own, this setting should be disabled.
EnableSecureConnection = false

[GameServer:RedirectorComponent]
;; Matchmaking server address to send to clients.
Matchmaking = "127.0.0.1:23001"
;; STUN server address to send to clients.
STUN = "127.0.0.1:23101"
;; TURN server address to send to clients.
TURN = "127.0.0.1:23101"
