[package]
name = "milan_schema"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.39", features = ["serde"] }
serde = { version = "1.0.217", features = ["derive"] }
uuid = { version = "1.12", features = ["serde"] }

compact_str = { version = "0.8.1", features = ["serde", "smallvec"], optional = true }
smallvec = { version = "1.13.2", features = ["serde", "const_generics"], optional = true }

[features]
inline = ["dep:compact_str", "dep:smallvec"]
